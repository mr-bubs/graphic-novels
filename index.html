<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Webtoons — mr-bubs</title>
<style>
  :root {
    --ink: #0c0c10;
    --paper: #f4f2ed;
    --accent: #ff5a36;
    --dim: rgba(244, 242, 237, 0.55);
    --rule: rgba(244, 242, 237, 0.1);
    --card-bg: #17161a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 56px 20px 80px;
  }

  .eyebrow {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
  }

  h1 {
    font-size: clamp(30px, 8vw, 40px);
    margin: 12px 0 40px;
    letter-spacing: -0.01em;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .book {
    display: block;
    text-decoration: none;
    color: inherit;
    border-radius: 10px;
    overflow: hidden;
    background: var(--card-bg);
    position: relative;
    aspect-ratio: 3 / 4;
  }

  .book-thumb {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    background: var(--card-bg);
    transition: transform 0.3s ease;
  }

  .book:active .book-thumb { transform: scale(1.03); }

  .book-thumb.loading { opacity: 0; }

  .book-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--dim);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .book-scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(12,12,16,0.95) 0%, rgba(12,12,16,0.55) 32%, rgba(12,12,16,0) 60%);
  }

  .book-info {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 14px 12px;
  }

  .book-title {
    font-size: 15px;
    font-weight: 700;
    line-height: 1.2;
    margin: 0 0 4px;
  }

  .book-meta {
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 0.02em;
  }

  @media (max-width: 380px) {
    .book-title { font-size: 14px; }
  }
</style>
</head>
<body>

<main>
  <div class="eyebrow">Webtoons</div>
  <h1>Read something</h1>

  <div class="grid" id="grid"></div>
</main>

<script>
  const GITHUB_USER = "mr-bubs";
  const GITHUB_REPO = "graphic-novels";
  const IMAGE_EXTENSIONS = [".jpg", ".jpeg", ".png", ".webp"];

  // ⬇️ Keep this list in sync with the BOOKS object in viewer.html.
  const BOOKS = [
    { key: "polynomials", title: "Polynomials", folder: "Polynomials/pages", meta: "2 chapters" },
    { key: "the-assigned", title: "The Assigned", folder: "Assigned/pages", meta: "Chapter 1, in progress" },
    { key: "art-of-love-and-destruction", title: "The Art of Love and Destruction", folder: "art-of-love/pages", meta: "Single chapter" },
    { key: "fallen", title: "Fallen", folder: "fallen/pages", meta: "4 Chapters | Finished" },
  ];

  async function loadCovers() {
    const grid = document.getElementById("grid");

    BOOKS.forEach(book => {
      const a = document.createElement("a");
      a.className = "book";
      a.href = `viewer.html?book=${book.key}`;
      a.innerHTML = `
        <div class="book-placeholder">Loading…</div>
        <img class="book-thumb loading" alt="${book.title} cover">
        <div class="book-scrim"></div>
        <div class="book-info">
          <p class="book-title">${book.title}</p>
          <p class="book-meta">${book.meta}</p>
        </div>
      `;
      grid.appendChild(a);
      book.el = a;
    });

    for (const book of BOOKS) {
      try {
        const res = await fetch(
          `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${book.folder}`
        );
        if (!res.ok) throw new Error("folder not found");
        const files = await res.json();

        const images = files
          .filter(f => IMAGE_EXTENSIONS.some(ext => f.name.toLowerCase().endsWith(ext)))
          .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));

        if (images.length === 0) throw new Error("no pages yet");

        const img = book.el.querySelector(".book-thumb");
        img.src = images[0].download_url;
        img.onload = () => {
          img.classList.remove("loading");
          book.el.querySelector(".book-placeholder").remove();
        };
      } catch (err) {
        book.el.querySelector(".book-placeholder").textContent = "No pages yet";
        console.error(book.title, err);
      }
    }
  }

  loadCovers();
</script>

</body>
</html>
